# converted from doa_findmax_and_save.xml for GNU Radio 3.8
id: doa_findmax_and_save
label: Find Max. and Save
category: DoA
parameters:
- id: num_inputs
  label: Num Inputs
  dtype: int
  hide: part
- id: samples_to_findmax
  label: Samples To Find Max.
  dtype: int
- id: config_filename
  label: Config File
  dtype: file_save
  default: /tmp/phases.cfg
inputs:
- domain: stream
  dtype: float
  multiplicity: ${ num_inputs }
templates:
  imports: import doa
  make: doa.findmax_and_save(${samples_to_findmax}, ${num_inputs}, ${config_filename})
documentation: "This block uses a certain number of samples from each input stream and stores the maximum\
  \ among those samples in a config file. \nArgs:\nnum_inputs: Number of inputs to the block.\nsamples_to_findmax:\
  \ Number of samples used from each stream to compute the maximum value.\nconfig_filename: Config file\
  \ which stores the result."
file_format: 1
