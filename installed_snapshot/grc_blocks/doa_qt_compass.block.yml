id: doa_qt_compass
label: QT GUI DoA Compass
category: DoA

parameters:
-   id: name
    label: Name
    dtype: string
    default: '""'
    hide: ${ 'none' if len(name()) > 0 else 'part' }
-   id: update_time
    label: Update Period
    dtype: float
    default: '0.10'
-   id: min_val
    label: Min Value
    dtype: float
    default: '-90'
-   id: max_val
    label: Max Value
    dtype: float
    default: '90'
-   id: step
    label: Tick Step
    dtype: float
    default: '10'
-   id: arc_bias
    label: Arc Bias
    dtype: float
    default: '0'
-   id: gui_hint
    label: GUI Hint
    dtype: gui_hint
    hide: part

inputs:
-   domain: stream
    dtype: float
    label: in

templates:
    imports: import doa
    make: |-
        <%
            win = 'self.%s.this_widget'%id
        %>\
        doa.compass(${name}, ${min_val}, ${max_val}, ${step}, ${arc_bias})
        ${gui_hint() % win}

documentation: |-
    Takes an angle in degrees and shows it on a compass dial.

    GR 3.8 port.  The original XML used the Cheetah idiom
        #set $win2 = 'self.%s.this_layout'%$id
    which GR 3.8's Mako templates reject with "'win2' is not defined".
    Replaced with a Mako <% win = ... %> block, as the stock qtgui blocks do.

    It points at this_widget, not this_layout: GRC emits addWidget(), and
    this_layout is a QVBoxLayout, so Qt5 raises a TypeError.  compass.py
    gained a this_widget container for exactly this.

file_format: 1
