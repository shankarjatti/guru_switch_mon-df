# converted from phase_correct_hier.xml for GNU Radio 3.8
id: phase_correct_hier
label: Phase Correct
category: DoA
parameters:
- id: num_ports
  label: Num Ports
  dtype: int
  default: '2'
  hide: part
- id: config_filename
  label: Config File
  dtype: file_open
  default: /tmp/phases.cfg
inputs:
- domain: stream
  dtype: complex
  multiplicity: ${ num_ports }
outputs:
- domain: stream
  dtype: complex
  multiplicity: ${ num_ports }
templates:
  imports: import doa
  make: "doa.phase_correct_hier(\n    num_ports=${num_ports},\n    config_filename=${config_filename},\n\
    )"
documentation: 'Correct phase offsets of N complex input channels, provided

  in a specified configuration file.

  Args:

  num_ports: Number of inputs to the block.

  config_filename: Config file which stores the result.'
file_format: 1
