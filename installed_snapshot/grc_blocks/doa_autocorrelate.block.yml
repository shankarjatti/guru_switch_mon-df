# converted from doa_autocorrelate.xml for GNU Radio 3.8
id: doa_autocorrelate
label: Autocorrelate
category: DoA
parameters:
- id: snapshot_size
  label: Snapshot Size
  dtype: int
  default: '2048'
- id: overlap_size
  label: Overlap Size
  dtype: int
  default: '512'
- id: inputs
  label: Num Inputs
  dtype: int
  default: '1'
  hide: part
- id: avg_method
  label: Averaging Method
  dtype: enum
  default: '0'
  options:
  - '0'
  - '1'
  option_labels:
  - Forward
  - Forward-Backward
inputs:
- domain: stream
  dtype: complex
  multiplicity: ${ inputs }
outputs:
- domain: stream
  dtype: complex
  vlen: ${ inputs*inputs }
asserts:
- ${ inputs > 0 }
- ${ snapshot_size > 0 }
- ${ overlap_size < snapshot_size }
templates:
  imports: import doa
  make: doa.autocorrelate(${inputs}, ${snapshot_size}, ${overlap_size}, ${avg_method})
documentation: "This block generates a sample correlation matrix for the input vector comprised of values\
  \ drawn from the receive channels. \nArgs:\ninputs: Number of inputs to the block\nsnapshot_size: Determines\
  \ num. of samples used to compute the sample correlation matrix\noverlap_size: Overlap size between\
  \ snapshots\navg_method: Use either standard forward-averaging method or a forward-backward averaging\
  \ method to compute the sample correlation matrix."
file_format: 1
