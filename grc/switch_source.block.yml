id: switch_source
label: "TwinRX DF/MON\n  Radio-Clock Source"
category: '[guru_switch]'
parameters:
- id: samp_rate
  label: Samp Rate
  dtype: real
  default: samp_rate
- id: addresses
  label: Device Address
  dtype: string
  default: addr=192.168.10.2
- id: num_bands
  label: Number of Bands
  dtype: int
  default: '3'
- id: settle
  label: Switching time per slot (s)
  dtype: real
  default: '0.01'
- id: guard_pre
  label: Part of it before each switch (s)
  dtype: real
  default: '0.00025'
- id: gain_trim
  label: Per-channel gain trim (dB)
  dtype: raw
  default: (0.0, 0.0, 0.0, 0.0)
- id: start_delay
  label: Delay before first hop (s)
  dtype: real
  default: '0.5'
  hide: part
- id: tx_control
  label: Lab transmitter control (host:port)
  dtype: string
  default: ''
- id: park_freq
  label: Park lab tone at (Hz, 0 = off)
  dtype: real
  default: '0'
- id: lock_check
  label: Lock check after switch (s)
  dtype: real
  default: '0.007'
  hide: part
- id: min_slack
  label: Min time to send a change (s)
  dtype: real
  default: '0.008'
  hide: part
- id: recv_buff_size
  label: Receive buffer (bytes)
  dtype: int
  default: '33554432'
  hide: part
- id: rt_priority
  label: Real-time priority (0 = off)
  dtype: int
  default: '0'
  hide: part
- id: preroll
  label: Burst pre-roll before each dwell (s)
  dtype: real
  default: '0.00025'
  hide: part
- id: freq_0
  label: '  band 0  |  freq (Hz)'
  dtype: real
  default: 2.4e9
- id: gain_0
  label: '  band 0  |  RX gain (dB)'
  dtype: real
  default: '46'
- id: dwell_0
  label: '  band 0  |  dwell (s)'
  dtype: real
  default: '0.01'
- id: freq_1
  label: '  band 1  |  freq (Hz)'
  dtype: real
  default: 5.2e9
  hide: ${ 'none' if int(num_bands) > 1 else 'all' }
- id: gain_1
  label: '  band 1  |  RX gain (dB)'
  dtype: real
  default: '60'
  hide: ${ 'none' if int(num_bands) > 1 else 'all' }
- id: dwell_1
  label: '  band 1  |  dwell (s)'
  dtype: real
  default: '0.01'
  hide: ${ 'none' if int(num_bands) > 1 else 'all' }
- id: freq_2
  label: '  band 2  |  freq (Hz)'
  dtype: real
  default: 5.8e9
  hide: ${ 'none' if int(num_bands) > 2 else 'all' }
- id: gain_2
  label: '  band 2  |  RX gain (dB)'
  dtype: real
  default: '69'
  hide: ${ 'none' if int(num_bands) > 2 else 'all' }
- id: dwell_2
  label: '  band 2  |  dwell (s)'
  dtype: real
  default: '0.01'
  hide: ${ 'none' if int(num_bands) > 2 else 'all' }
- id: freq_3
  label: '  band 3  |  freq (Hz)'
  dtype: real
  default: 1.0e9
  hide: ${ 'none' if int(num_bands) > 3 else 'all' }
- id: gain_3
  label: '  band 3  |  RX gain (dB)'
  dtype: real
  default: '46'
  hide: ${ 'none' if int(num_bands) > 3 else 'all' }
- id: dwell_3
  label: '  band 3  |  dwell (s)'
  dtype: real
  default: '0.01'
  hide: ${ 'none' if int(num_bands) > 3 else 'all' }
- id: mon_freqs
  label: 'MON: ch0..ch3 frequency (Hz)'
  dtype: raw
  default: (900e6, 2.4e9, 5.2e9, 5.8e9)
- id: mon_gains
  label: 'MON: ch0..ch3 RX gain (dB)'
  dtype: raw
  default: (60, 46, 60, 69)
- id: mon_dwell
  label: 'MON: burst length (s)'
  dtype: real
  default: '0.02'
- id: start_mode
  label: Mode (df / mon)
  dtype: string
  default: df
- id: switch_gap
  label: Gap before a mode switch (s)
  dtype: real
  default: '0.01'
  hide: part
asserts:
- ${ 1 <= int(num_bands) <= 4 }
- ${ 0 <= guard_pre < settle }
outputs:
- label: df
  domain: stream
  dtype: complex
  multiplicity: '4'
- label: mon
  domain: stream
  dtype: complex
  multiplicity: '4'
templates:
  imports: import switch_source
  make: "switch_source.switch_source(\n    samp_rate=${samp_rate},\n    addresses=${addresses},\n    bands=[\n%\
    \ if int(num_bands) > 0:\n        (${freq_0}, ${gain_0}, ${dwell_0}),\n% endif\n% if int(num_bands) > 1:\n \
    \       (${freq_1}, ${gain_1}, ${dwell_1}),\n% endif\n% if int(num_bands) > 2:\n        (${freq_2}, ${gain_2},\
    \ ${dwell_2}),\n% endif\n% if int(num_bands) > 3:\n        (${freq_3}, ${gain_3}, ${dwell_3}),\n% endif\n  \
    \  ],\n    settle=${settle},\n    guard_pre=${guard_pre},\n    gain_trim=${gain_trim},\n    start_delay=${start_delay},\n\
    \    tx_control=${tx_control},\n    park_freq=${park_freq},\n    lock_check=${lock_check},\n    min_slack=${min_slack},\n\
    \    recv_buff_size=${recv_buff_size},\n    rt_priority=${rt_priority},\n    preroll=${preroll},\n    mon_freqs=${mon_freqs},\n\
    \    mon_gains=${mon_gains},\n    mon_dwell=${mon_dwell},\n    start_mode=${start_mode},\n    switch_gap=${switch_gap},\n\
    )"
  callbacks:
  - set_park_freq(${park_freq})
  - set_mode(${start_mode})
documentation: 'USRP-2945 source with DF (shared LO, hopping, burst mode) and MON (every channel its own internal
  LO and band, bursts joined with no gap), switched at a slot boundary on the radio clock (switch_source.py, engine
  libtwinrx_switch.so in this folder).

  Outputs 0-3: DF (hop_off / hop_on / hop_cycle, zeros during MON).

  Outputs 4-7: MON (mon_on / mon_bad / mon_off, zeros during DF).

  Mode: ''df'' or ''mon''; changing it at run time switches (callback set_mode).'
file_format: 1
